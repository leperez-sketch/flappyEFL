<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Verbs - Multiplayer EFL Game</title>
    <!-- PeerJS WebRTC Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #70c5ce;
            border: 6px solid #fff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 10px 0; text-shadow: 3px 3px #000; font-size: 3rem; color: #ffeb3b; }
        h2 { margin: 0 0 15px 0; text-shadow: 2px 2px #000; font-size: 1.6rem; }
        
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 14px 24px;
            margin: 6px 0;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 65%;
            box-shadow: 0 5px #bf360c;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px #bf360c; }
        .btn-level { background: #4caf50; box-shadow: 0 5px #1b5e20; }
        .btn-join { background: #2196f3; box-shadow: 0 5px #0d47a1; }

        input {
            width: 65%;
            padding: 12px 20px;
            margin: 8px 0;
            font-size: 1.3rem;
            border-radius: 25px;
            border: 3px solid #fff;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        /* Lobby de jugadores */
        #player-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 80%;
            margin: 15px 0;
        }
        .slot {
            background: rgba(0,0,0,0.4);
            border: 2px dashed #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        canvas { display: block; background: #70c5ce; }

        #hud {
            position: absolute;
            top: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; font-size: 1.5rem; font-weight: bold;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 5;
        }
        #prompt-banner {
            position: absolute;
            top: 50px; left: 0; width: 100%;
            text-align: center; font-size: 2rem; font-weight: bold;
            color: #fff; text-shadow: 3px 3px #000;
            pointer-events: none; z-index: 5;
            background: rgba(0,0,0,0.3); padding: 6px 0;
        }

        /* Pantalla de Control Móvil */
        #mobile-controller {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #111;
        }
        #tap-button {
            width: 90%; height: 75%;
            border-radius: 25px;
            border: 5px solid #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: bold; text-shadow: 2px 2px #000;
            box-shadow: 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- MODE SELECTION -->
    <div id="mode-screen" class="screen">
        <h1>Flappy Verbs</h1>
        <h2>Select Display Mode</h2>
        <button class="btn btn-level" onclick="setupHost()">🖥️ Host Game (Smartboard)</button>
        <button class="btn btn-join" onclick="showJoinScreen()">📱 Join Game (Student Device)</button>
    </div>

    <!-- HOST LOBBY (SMARTBOARD) -->
    <div id="host-lobby-screen" class="screen hidden">
        <h1>Room Code: <span id="room-code-display" style="color:#ffeb3b;">----</span></h1>
        <div style="display:flex; align-items:center; gap:20px;">
            <img id="qr-code-img" src="" width="130" height="130" style="border:3px solid #fff; border-radius:8px;" alt="QR Code">
            <div style="text-align:left;">
                <p style="margin:0; font-size:1.2rem;">1. Scan QR or enter Room Code.</p>
                <p style="margin:5px 0 0 0; font-size:1.2rem;">2. Enter student name.</p>
            </div>
        </div>
        <div id="player-slots">
            <div class="slot" id="slot-0">Waiting...</div>
            <div class="slot" id="slot-1">Waiting...</div>
            <div class="slot" id="slot-2">Waiting...</div>
            <div class="slot" id="slot-3">Waiting...</div>
            <div class="slot" id="slot-4">Waiting...</div>
            <div class="slot" id="slot-5">Waiting...</div>
        </div>
        <h2>Select CEFR & Tense</h2>
        <div style="display:flex; gap:10px; width:70%;">
            <select id="cefr-select" style="flex:1; font-size:1.1rem; padding:8px; border-radius:10px; font-weight:bold;">
                <option value="A1">A1 - Beginner</option>
                <option value="A2">A2 - Elementary</option>
                <option value="B1">B1 - Intermediate</option>
                <option value="B2">B2 - Upper Intermediate</option>
                <option value="C1">C1 - Advanced</option>
            </select>
            <select id="tense-select" style="flex:1; font-size:1.1rem; padding:8px; border-radius:10px; font-weight:bold;">
                <option value="simplePast">Simple Past</option>
                <option value="participle">Past Participle</option>
            </select>
        </div>
        <button class="btn btn-level" style="margin-top:15px;" onclick="startHostGame()">🚀 Start Match</button>
    </div>

    <!-- JOIN SCREEN (STUDENT) -->
    <div id="join-screen" class="screen hidden">
        <h1>Join Game</h1>
        <input type="text" id="join-code-input" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;">
        <input type="text" id="player-name-input" placeholder="YOUR NAME" maxlength="10">
        <button class="btn btn-join" onclick="connectToHost()">Connect</button>
        <p id="join-status" style="color:#ffeb3b; font-weight:bold;"></p>
    </div>

    <!-- MOBILE CONTROLLER SCREEN -->
    <div id="controller-screen" class="screen hidden">
        <div id="mobile-controller">
            <h2 id="player-hud-name" style="margin:10px 0;">Player</h2>
            <div id="tap-button" onmousedown="sendFlap()" ontouchstart="sendFlap(event)">TAP TO FLAP</div>
        </div>
    </div>

    <!-- GAME OVER SCREEN (HOST) -->
    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.88);">
        <h1 style="color: #f44336; font-size: 3.5rem;">Match Ended</h1>
        <div id="leaderboard-results" style="width:80%; font-size:1.4rem; line-height:1.6; font-weight:bold; margin-bottom:15px;"></div>
        <button class="btn btn-level" onclick="restartMatch()">Play Again</button>
    </div>

    <!-- GAMEPLAY CANVAS -->
    <div id="gameplay-container" class="hidden">
        <div id="hud">
            <span>Players Alive: <span id="alive-count">0</span></span>
        </div>
        <div id="prompt-banner">Infinitive: <span id="target-verb" style="color:#ffeb3b;">GO</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
</div>

<script>
    // --- COLOR PALETTE FOR 6 PLAYERS ---
    const BIRD_COLORS = [
        { name: "Yellow", hex: "#ffeb3b", dark: "#f57f17" },
        { name: "Red", hex: "#ff1744", dark: "#b71c1c" },
        { name: "Cyan", hex: "#00e5ff", dark: "#00838f" },
        { name: "Green", hex: "#00e676", dark: "#1b5e20" },
        { name: "Magenta", hex: "#e040fb", dark: "#4a148c" },
        { name: "Orange", hex: "#ff9100", dark: "#e65100" }
    ];

    // --- VELOCITY MATRIX (+0.50 INCREASE) ---
    const configuration = {
        A1: { speed: 1.5, gap: 240 },
        A2: { speed: 1.7, gap: 220 },
        B1: { speed: 1.9, gap: 200 },
        B2: { speed: 2.1, gap: 190 },
        C1: { speed: 2.3, gap: 180 }
    };

    // --- VERB DATABASE (A1 - C1) ---
    const verbDatabase = {
        A1: {
            simplePast: [{ inf: "Play", corr: "played", incorr: "playedd" }, { inf: "Eat", corr: "ate", incorr: "eated" }, { inf: "Go", corr: "went", incorr: "gone" }],
            participle: [{ inf: "Play", corr: "played", incorr: "playen" }, { inf: "Eat", corr: "eaten", incorr: "ate" }, { inf: "Go", corr: "gone", incorr: "went" }]
        },
        A2: {
            simplePast: [{ inf: "Buy", corr: "bought", incorr: "buyed" }, { inf: "Write", corr: "wrote", incorr: "writed" }, { inf: "See", corr: "saw", incorr: "seen" }],
            participle: [{ inf: "Buy", corr: "bought", incorr: "boughten" }, { inf: "Write", corr: "written", incorr: "wrote" }, { inf: "See", corr: "seen", incorr: "saw" }]
        },
        B1: {
            simplePast: [{ inf: "Speak", corr: "spoke", incorr: "speaked" }, { inf: "Understand", corr: "understood", incorr: "understanded" }],
            participle: [{ inf: "Speak", corr: "spoken", incorr: "spoke" }, { inf: "Understand", corr: "understood", incorr: "understanden" }]
        },
        B2: {
            simplePast: [{ inf: "Freeze", corr: "froze", incorr: "freezed" }, { inf: "Seek", corr: "sought", incorr: "seeked" }],
            participle: [{ inf: "Freeze", corr: "frozen", incorr: "froze" }, { inf: "Seek", corr: "sought", incorr: "soughten" }]
        },
        C1: {
            simplePast: [{ inf: "Undergo", corr: "underwent", incorr: "undergone" }, { inf: "Shrink", corr: "shrank", incorr: "shrunked" }],
            participle: [{ inf: "Undergo", corr: "undergone", incorr: "underwent" }, { inf: "Shrink", corr: "shrunk", incorr: "shrank" }]
        }
    };

    // --- GAME ENGINE VARIABLES ---
    let isHost = false;
    let peer = null;
    let roomCode = "";
    let connectedPlayers = []; // { id, name, color, conn, bird }
    let gameActive = false;
    let frameCounter = 0;
    let chosenLevel = "A1";
    let chosenType = "simplePast";

    const GRAVITY = 0.12;
    const FLAP_STRENGTH = -4.2;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let pipes = [];
    let currentVerbPair = null;
    let animationId = null;

    // --- SCREEN NAVIGATION ---
    function switchScreen(fromId, toId) {
        document.getElementById(fromId).classList.add('hidden');
        document.getElementById(toId).classList.remove('hidden');
    }

    // --- PEERJS SETUP (HOST) ---
    function setupHost() {
        isHost = true;
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('room-code-display').innerText = roomCode;

        // Generate QR code
        const currentUrl = window.location.href.split('?')[0];
        const joinUrl = `${currentUrl}?room=${roomCode}`;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;

        peer = new Peer(`FV-${roomCode}`);

        peer.on('open', () => {
            switchScreen('mode-screen', 'host-lobby-screen');
        });

        peer.on('connection', (conn) => {
            conn.on('data', (data) => handleHostMessage(conn, data));
            conn.on('close', () => removePlayer(conn.peer));
        });
    }

    function handleHostMessage(conn, data) {
        if (data.type === 'JOIN') {
            if (connectedPlayers.length >= 6 || gameActive) {
                conn.send({ type: 'ERROR', message: 'Room Full or Game in Progress' });
                return;
            }
            const colorObj = BIRD_COLORS[connectedPlayers.length];
            const player = {
                id: conn.peer,
                name: data.name || `Player ${connectedPlayers.length + 1}`,
                color: colorObj,
                conn: conn,
                bird: {
                    x: 100 + (connectedPlayers.length * 30), // Staggered X start
                    y: 300,
                    radius: 18,
                    velocity: 0,
                    isAlive: true,
                    score: 0
                }
            };
            connectedPlayers.push(player);
            updateLobbyUI();

            conn.send({ type: 'JOIN_SUCCESS', color: colorObj, name: player.name });
        } else if (data.type === 'FLAP') {
            const p = connectedPlayers.find(p => p.id === conn.peer);
            if (p && p.bird.isAlive && gameActive) {
                p.bird.velocity = FLAP_STRENGTH;
            }
        }
    }

    function updateLobbyUI() {
        for (let i = 0; i < 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            if (connectedPlayers[i]) {
                slot.style.background = connectedPlayers[i].color.hex;
                slot.style.color = '#000';
                slot.innerText = `${i + 1}. ${connectedPlayers[i].name}`;
            } else {
                slot.style.background = "rgba(0,0,0,0.4)";
                slot.style.color = "#fff";
                slot.innerText = "Waiting...";
            }
        }
    }

    function removePlayer(peerId) {
        connectedPlayers = connectedPlayers.filter(p => p.id !== peerId);
        updateLobbyUI();
    }

    // --- PEERJS SETUP (PLAYER / CLIENT) ---
    function showJoinScreen() {
        switchScreen('mode-screen', 'join-screen');
        // Auto-fill room code from URL query if available
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            document.getElementById('join-code-input').value = urlParams.get('room');
        }
    }

    function connectToHost() {
        const code = document.getElementById('join-code-input').value.toUpperCase();
        const name = document.getElementById('player-name-input').value;

        if (!code || !name) {
            document.getElementById('join-status').innerText = "Enter Code & Name!";
            return;
        }

        document.getElementById('join-status').innerText = "Connecting...";
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(`FV-${code}`);
            
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: name });
            });

            conn.on('data', (data) => {
                if (data.type === 'JOIN_SUCCESS') {
                    document.getElementById('player-hud-name').innerText = data.name;
                    document.getElementById('tap-button').style.background = data.color.hex;
                    document.getElementById('tap-button').style.color = '#000';
                    switchScreen('join-screen', 'controller-screen');
                } else if (data.type === 'ERROR') {
                    document.getElementById('join-status').innerText = data.message;
                }
            });
        });
    }

    function sendFlap(e) {
        if (e && e.type === 'touchstart') e.preventDefault();
        if (peer && peer.connections) {
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => c.send({ type: 'FLAP' }));
            });
        }
    }

    // --- GAME ENGINE (HOST) ---
    function startHostGame() {
        if (connectedPlayers.length === 0) {
            alert("At least 1 player must join!");
            return;
        }
        chosenLevel = document.getElementById('cefr-select').value;
        chosenType = document.getElementById('tense-select').value;

        switchScreen('host-lobby-screen', 'gameplay-container');
        initMatch();
    }

    function initMatch() {
        frameCounter = 0;
        pipes = [];
        gameActive = true;

        connectedPlayers.forEach((p, idx) => {
            p.bird.y = 300;
            p.bird.velocity = 0;
            p.bird.isAlive = true;
            p.bird.score = 0;
            p.bird.x = 100 + (idx * 25);
        });

        spawnPipeSet(800);
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function spawnPipeSet(startX) {
        const config = configuration[chosenLevel];
        const pool = verbDatabase[chosenLevel][chosenType];
        currentVerbPair = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('target-verb').innerText = currentVerbPair.inf.toUpperCase();

        const minHeight = 80;
        const maxHeight = canvas.height - config.gap - minHeight;
        const topPipeHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        const isTopCorrect = Math.random() > 0.5;

        pipes.push({
            x: startX,
            width: 130,
            topHeight: topPipeHeight,
            gap: config.gap,
            topText: isTopCorrect ? currentVerbPair.corr : currentVerbPair.incorr,
            bottomText: isTopCorrect ? currentVerbPair.incorr : currentVerbPair.corr,
            topIsCorrect: isTopCorrect
        });
    }

    function drawPipe(x, y, width, height, isTop) {
        let grad = ctx.createLinearGradient(x, 0, x + width, 0);
        grad.addColorStop(0, '#388e3c');
        grad.addColorStop(0.2, '#81c784');
        grad.addColorStop(0.4, '#a5d6a7');
        grad.addColorStop(0.7, '#2e7d32');
        grad.addColorStop(1, '#1b5e20');

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, width, height);
        ctx.strokeStyle = '#0d3c10';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);
    }

    function drawBird(p, frame) {
        const b = p.bird;
        if (!b.isAlive) return;

        ctx.save();
        ctx.translate(b.x, b.y);

        let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, b.velocity * 0.08));
        ctx.rotate(angle);

        // Player Name Tag
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p.name, 0, -b.radius - 10);

        // Bird Body with Custom Player Color
        ctx.fillStyle = p.color.hex;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.radius + 4, b.radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Wing Animation
        let wingOffsetY = Math.sin(frame * 0.25) * 7;
        ctx.fillStyle = p.color.dark;
        ctx.beginPath();
        ctx.ellipse(-6, wingOffsetY, 11, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eye & Beak
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(8, -6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(10, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 8);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        if (!gameActive) return;
        frameCounter++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        ctx.fillStyle = "#70c5ce";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const config = configuration[chosenLevel];

        // Update Physics for each player independently (NO BIRD-TO-BIRD COLLISION)
        let activeCount = 0;
        connectedPlayers.forEach(p => {
            if (p.bird.isAlive) {
                activeCount++;
                p.bird.velocity += GRAVITY;
                p.bird.y += p.bird.velocity;

                // Out of Bounds
                if (p.bird.y + p.bird.radius > canvas.height || p.bird.y - p.bird.radius < 0) {
                    p.bird.isAlive = false;
                }
            }
            drawBird(p, frameCounter);
        });

        document.getElementById('alive-count').innerText = activeCount;

        // Render Pipes & Evaluate Collisions
        for (let i = pipes.length - 1; i >= 0; i--) {
            let pipe = pipes[i];
            pipe.x -= config.speed;

            let bottomY = pipe.topHeight + pipe.gap;

            drawPipe(pipe.x, 0, pipe.width, pipe.topHeight, true);
            drawPipe(pipe.x, bottomY, pipe.width, canvas.height - bottomY, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.shadowColor = "black"; ctx.shadowBlur = 6;
            ctx.fillText(pipe.topText, pipe.x + pipe.width / 2, pipe.topHeight - 40);
            ctx.fillText(pipe.bottomText, pipe.x + pipe.width / 2, bottomY + 40);
            ctx.shadowBlur = 0;

            // Collision check per player against pipes
            connectedPlayers.forEach(p => {
                if (!p.bird.isAlive) return;

                if (p.bird.x + p.bird.radius > pipe.x && p.bird.x - p.bird.radius < pipe.x + pipe.width) {
                    // Hit Top Pipe
                    if (p.bird.y - p.bird.radius < pipe.topHeight) {
                        if (pipe.topIsCorrect) p.bird.score++;
                        else p.bird.isAlive = false;
                    } 
                    // Hit Bottom Pipe
                    else if (p.bird.y + p.bird.radius > bottomY) {
                        if (!pipe.topIsCorrect) p.bird.score++;
                        else p.bird.isAlive = false;
                    }
                }
            });

            if (pipe.x + pipe.width < 0) {
                pipes.splice(i, 1);
                spawnPipeSet(800);
            }
        }

        // End Game when all players are eliminated
        if (activeCount === 0) {
            endMatch();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    function endMatch() {
        gameActive = false;
        cancelAnimationFrame(animationId);

        let resultsHTML = "<h3>Leaderboard</h3>";
        let sorted = [...connectedPlayers].sort((a, b) => b.bird.score - a.bird.score);
        
        sorted.forEach((p, rank) => {
            resultsHTML += `<p style="color:${p.color.hex}">${rank + 1}. ${p.name} - ${p.bird.score} pts</p>`;
        });

        document.getElementById('leaderboard-results').innerHTML = resultsHTML;
        switchScreen('gameplay-container', 'gameover-screen');
    }

    function restartMatch() {
        switchScreen('gameover-screen', 'gameplay-container');
        initMatch();
    }
</script>
</body>
</html>
