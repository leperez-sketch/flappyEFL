<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Verbs - Multiplayer EFL Game</title>
    <!-- PeerJS WebRTC Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background: #10101c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #4ec0ca;
            border: 6px solid #fff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 10px 0; text-shadow: 3px 3px #000; font-size: 3rem; color: #ffeb3b; }
        h2 { margin: 0 0 15px 0; text-shadow: 2px 2px #000; font-size: 1.6rem; }
        
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 14px 24px;
            margin: 6px 0;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 65%;
            box-shadow: 0 5px #bf360c;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px #bf360c; }
        .btn-level { background: #4caf50; box-shadow: 0 5px #1b5e20; }
        .btn-join { background: #2196f3; box-shadow: 0 5px #0d47a1; }

        input {
            width: 65%;
            padding: 12px 20px;
            margin: 8px 0;
            font-size: 1.3rem;
            border-radius: 25px;
            border: 3px solid #fff;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #player-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 80%;
            margin: 15px 0;
        }
        .slot {
            background: rgba(0,0,0,0.5);
            border: 2px dashed #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        canvas { display: block; background: #4ec0ca; }

        #hud {
            position: absolute;
            top: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; font-size: 1.5rem; font-weight: bold;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 5;
        }
        #prompt-banner {
            position: absolute;
            top: 50px; left: 0; width: 100%;
            text-align: center; font-size: 2rem; font-weight: bold;
            color: #fff; text-shadow: 3px 3px #000;
            pointer-events: none; z-index: 5;
            background: rgba(0,0,0,0.4); padding: 6px 0;
        }

        #mobile-controller {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #111;
        }
        #tap-button {
            width: 90%; height: 75%;
            border-radius: 25px;
            border: 5px solid #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: bold; text-shadow: 2px 2px #000;
            box-shadow: 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- MODE SELECTION -->
    <div id="mode-screen" class="screen">
        <h1>Flappy Verbs</h1>
        <h2>Select Display Mode</h2>
        <button class="btn btn-level" onclick="setupHost()">🖥️ Host Game (Smartboard)</button>
        <button class="btn btn-join" onclick="showJoinScreen()">📱 Join Game (Student Device)</button>
    </div>

    <!-- HOST LOBBY -->
    <div id="host-lobby-screen" class="screen hidden">
        <h1>Room Code: <span id="room-code-display" style="color:#ffeb3b;">----</span></h1>
        <div style="display:flex; align-items:center; gap:20px;">
            <img id="qr-code-img" src="" width="130" height="130" style="border:3px solid #fff; border-radius:8px;" alt="QR Code">
            <div style="text-align:left;">
                <p style="margin:0; font-size:1.2rem;">1. Scan QR or enter Room Code.</p>
                <p style="margin:5px 0 0 0; font-size:1.2rem;">2. Enter student name.</p>
            </div>
        </div>
        <div id="player-slots">
            <div class="slot" id="slot-0">Waiting...</div>
            <div class="slot" id="slot-1">Waiting...</div>
            <div class="slot" id="slot-2">Waiting...</div>
            <div class="slot" id="slot-3">Waiting...</div>
            <div class="slot" id="slot-4">Waiting...</div>
            <div class="slot" id="slot-5">Waiting...</div>
        </div>
        <h2>Select CEFR & Tense</h2>
        <div style="display:flex; gap:10px; width:70%;">
            <select id="cefr-select" style="flex:1; font-size:1.1rem; padding:8px; border-radius:10px; font-weight:bold;">
                <option value="A1">A1 - Beginner</option>
                <option value="A2">A2 - Elementary</option>
                <option value="B1">B1 - Intermediate</option>
                <option value="B2">B2 - Upper Intermediate</option>
                <option value="C1">C1 - Advanced</option>
            </select>
            <select id="tense-select" style="flex:1; font-size:1.1rem; padding:8px; border-radius:10px; font-weight:bold;">
                <option value="simplePast">Simple Past</option>
                <option value="participle">Past Participle</option>
            </select>
        </div>
        <button class="btn btn-level" style="margin-top:15px;" onclick="startHostGame()">🚀 Start Match</button>
    </div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="screen hidden">
        <h1>Join Game</h1>
        <input type="text" id="join-code-input" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;">
        <input type="text" id="player-name-input" placeholder="YOUR NAME" maxlength="10">
        <button class="btn btn-join" onclick="connectToHost()">Connect</button>
        <p id="join-status" style="color:#ffeb3b; font-weight:bold;"></p>
    </div>

    <!-- CONTROLLER SCREEN -->
    <div id="controller-screen" class="screen hidden">
        <div id="mobile-controller">
            <h2 id="player-hud-name" style="margin:10px 0;">Player</h2>
            <div id="tap-button" onmousedown="sendFlap()" ontouchstart="sendFlap(event)">TAP TO FLAP</div>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.88);">
        <h1 style="color: #f44336; font-size: 3.5rem;">Match Ended</h1>
        <div id="leaderboard-results" style="width:80%; font-size:1.4rem; line-height:1.6; font-weight:bold; margin-bottom:15px;"></div>
        <button class="btn btn-level" onclick="restartMatch()">Play Again</button>
    </div>

    <!-- GAMEPLAY CANVAS -->
    <div id="gameplay-container" class="hidden">
        <div id="hud">
            <span>Players Alive: <span id="alive-count">0</span></span>
        </div>
        <div id="prompt-banner">Infinitive: <span id="target-verb" style="color:#ffeb3b;">GO</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
</div>

                { inf: "Beseech", corr: "besought", incorr: "besoughten" }, { inf: "Cleave", corr: "cloven", incorr: "clove" },
                { inf: "Sling", corr: "slung", incorr: "slungen" }, { inf: "Slink", corr: "slunk", incorr: "slunken" },
                { inf: "Smite", corr: "smitten", incorr: "smote" }, { inf: "Spin", corr: "spun", incorr: "spunnen" },
                { inf: "Spit", corr: "spat", incorr: "spitten" }, { inf: "Split", corr: "split", incorr: "splitten" },
                { inf: "Stave", corr: "stoven", incorr: "stove" }, { inf: "Strew", corr: "strewn", incorr: "strewed" },
                { inf: "Stride", corr: "strridden", incorr: "strode" }, { inf: "Strive", corr: "striven", incorr: "strove" },
                { inf: "Sublet", corr: "sublet", incorr: "subletten" }, { inf: "Swell", corr: "swollen", incorr: "swelled" },
                { inf: "Thrust", corr: "thrust", incorr: "thrusten" }, { inf: "Tread", corr: "trodden", incorr: "trod" },
                { inf: "Uphold", corr: "upheld", incorr: "uphelden" }, { inf: "Withdraw", corr: "withdrawn", incorr: "withdrew" },
                { inf: "Withhold", corr: "withheld", incorr: "withhelden" }, { inf: "Withstand", corr: "withstood", incorr: "withstooden" },
                { inf: "Wring", corr: "wrung", incorr: "wrungen" }, { inf: "Overthrow", corr: "overthrown", incorr: "overthrew" },
                { inf: "Undertake", corr: "undertaken", incorr: "undertook" }, { inf: "Outdo", corr: "outdone", incorr: "outdid" },
                { inf: "Overhear", corr: "overheard", incorr: "overhearden" }, { inf: "Foresee", corr: "foreseen", incorr: "foresaw" }
            ]
        }
    };

    let isHost = false;
    let peer = null;
    let roomCode = "";
    let connectedPlayers = [];
    let gameActive = false;
    let frameCounter = 0;
    let chosenLevel = "A1";
    let chosenType = "simplePast";

    const GRAVITY = 0.12;
    const FLAP_STRENGTH = -4.2;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let pipes = [];
    let currentVerbPair = null;
    let animationId = null;

    function switchScreen(fromId, toId) {
        document.getElementById(fromId).classList.add('hidden');
        document.getElementById(toId).classList.remove('hidden');
    }

    function setupHost() {
        isHost = true;
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('room-code-display').innerText = roomCode;

        const currentUrl = window.location.href.split('?')[0];
        const joinUrl = `${currentUrl}?room=${roomCode}`;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;

        peer = new Peer(`FV-${roomCode}`);
        peer.on('open', () => switchScreen('mode-screen', 'host-lobby-screen'));
        peer.on('connection', (conn) => {
            conn.on('data', (data) => handleHostMessage(conn, data));
            conn.on('close', () => removePlayer(conn.peer));
        });
    }

    function handleHostMessage(conn, data) {
        if (data.type === 'JOIN') {
            if (connectedPlayers.length >= 6 || gameActive) {
                conn.send({ type: 'ERROR', message: 'Room Full or Game in Progress' });
                return;
            }
            const colorObj = BIRD_COLORS[connectedPlayers.length];
            const player = {
                id: conn.peer,
                name: data.name || `Player ${connectedPlayers.length + 1}`,
                color: colorObj,
                conn: conn,
                bird: {
                    x: 100 + (connectedPlayers.length * 30),
                    y: 300,
                    radius: 18,
                    velocity: 0,
                    isAlive: true,
                    score: 0
                }
            };
            connectedPlayers.push(player);
            updateLobbyUI();
            conn.send({ type: 'JOIN_SUCCESS', color: colorObj, name: player.name });
        } else if (data.type === 'FLAP') {
            const p = connectedPlayers.find(p => p.id === conn.peer);
            if (p && p.bird.isAlive && gameActive) {
                p.bird.velocity = FLAP_STRENGTH;
            }
        }
    }

    function updateLobbyUI() {
        for (let i = 0; i < 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            if (connectedPlayers[i]) {
                slot.style.background = connectedPlayers[i].color.hex;
                slot.style.color = '#000';
                slot.innerText = `${i + 1}. ${connectedPlayers[i].name}`;
            } else {
                slot.style.background = "rgba(0,0,0,0.5)";
                slot.style.color = "#fff";
                slot.innerText = "Waiting...";
            }
        }
    }

    function removePlayer(peerId) {
        connectedPlayers = connectedPlayers.filter(p => p.id !== peerId);
        updateLobbyUI();
    }

    function showJoinScreen() {
        switchScreen('mode-screen', 'join-screen');
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            document.getElementById('join-code-input').value = urlParams.get('room');
        }
    }

    function connectToHost() {
        const code = document.getElementById('join-code-input').value.toUpperCase();
        const name = document.getElementById('player-name-input').value;

        if (!code || !name) {
            document.getElementById('join-status').innerText = "Enter Code & Name!";
            return;
        }

        document.getElementById('join-status').innerText = "Connecting...";
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(`FV-${code}`);
            conn.on('open', () => conn.send({ type: 'JOIN', name: name }));
            conn.on('data', (data) => {
                if (data.type === 'JOIN_SUCCESS') {
                    document.getElementById('player-hud-name').innerText = data.name;
                    document.getElementById('tap-button').style.background = data.color.hex;
                    document.getElementById('tap-button').style.color = '#000';
                    switchScreen('join-screen', 'controller-screen');
                } else if (data.type === 'ERROR') {
                    document.getElementById('join-status').innerText = data.message;
                }
            });
        });
    }

    function sendFlap(e) {
        if (e && e.type === 'touchstart') e.preventDefault();
        if (peer && peer.connections) {
            Object.values(peer.connections).forEach(conns => {
                conns.forEach(c => c.send({ type: 'FLAP' }));
            });
        }
    }

    function startHostGame() {
        if (connectedPlayers.length === 0) {
            alert("At least 1 player must join!");
            return;
        }
        chosenLevel = document.getElementById('cefr-select').value;
        chosenType = document.getElementById('tense-select').value;

        switchScreen('host-lobby-screen', 'gameplay-container');
        initMatch();
    }

    function initMatch() {
        frameCounter = 0;
        pipes = [];
        gameActive = true;

        connectedPlayers.forEach((p, idx) => {
            p.bird.y = 300;
            p.bird.velocity = 0;
            p.bird.isAlive = true;
            p.bird.score = 0;
            p.bird.x = 100 + (idx * 25);
        });

        spawnPipeSet(800);
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function spawnPipeSet(startX) {
        const config = configuration[chosenLevel];
        const pool = verbDatabase[chosenLevel][chosenType];
        currentVerbPair = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('target-verb').innerText = currentVerbPair.inf.toUpperCase();

        const minHeight = 80;
        const maxHeight = canvas.height - config.gap - minHeight - 60; // Leave room for ground
        const topPipeHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        const isTopCorrect = Math.random() > 0.5;

        pipes.push({
            x: startX,
            width: 120,
            topHeight: topPipeHeight,
            gap: config.gap,
            topText: isTopCorrect ? currentVerbPair.corr : currentVerbPair.incorr,
            bottomText: isTopCorrect ? currentVerbPair.incorr : currentVerbPair.corr,
            topIsCorrect: isTopCorrect
        });
    }

    // --- ENHANCED CANVAS BACKGROUND (SKY, CLOUDS, HILLS, GROUND) ---
    function drawEnhancedBackground(frame) {
        // Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#4ec0ca');
        skyGrad.addColorStop(0.7, '#81d4fa');
        skyGrad.addColorStop(1, '#e0f7fa');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Animated Clouds
        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        let cloudX1 = (frame * 0.4) % (canvas.width + 200) - 100;
        let cloudX2 = (frame * 0.2 + 300) % (canvas.width + 200) - 100;

        drawCloud(cloudX1, 80, 40);
        drawCloud(cloudX2, 140, 30);

        // Background City / Hill Skyline
        ctx.fillStyle = "#73bf2e";
        ctx.beginPath();
        ctx.arc(150, 560, 220, Math.PI, 0, false);
        ctx.arc(500, 570, 260, Math.PI, 0, false);
        ctx.arc(800, 560, 200, Math.PI, 0, false);
        ctx.fill();

        ctx.fillStyle = "#558000";
        ctx.beginPath();
        ctx.arc(320, 570, 180, Math.PI, 0, false);
        ctx.arc(680, 580, 190, Math.PI, 0, false);
        ctx.fill();

        // Animated Ground Stripe
        const groundHeight = 50;
        const groundY = canvas.height - groundHeight;

        // Ground Base
        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, groundY, canvas.width, groundHeight);

        // Grass Top Trim
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(0, groundY, canvas.width, 14);
        ctx.fillStyle = "#558000";
        ctx.fillRect(0, groundY + 14, canvas.width, 4);

        // Ground Diagonal Stripes
        ctx.strokeStyle = "#ceb86c";
        ctx.lineWidth = 6;
        let offset = (frame * 2) % 24;
        for (let x = -30 + offset; x < canvas.width + 30; x += 24) {
            ctx.beginPath();
            ctx.moveTo(x, groundY + 18);
            ctx.lineTo(x - 12, canvas.height);
            ctx.stroke();
        }
    }

    function drawCloud(x, y, scale) {
        ctx.beginPath();
        ctx.arc(x, y, scale, 0, Math.PI * 2);
        ctx.arc(x + scale * 0.7, y - scale * 0.4, scale * 0.7, 0, Math.PI * 2);
        ctx.arc(x + scale * 1.3, y, scale * 0.8, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
    }

    // --- ENHANCED 3D TUBE (MARIO STYLE PIPES WITH CAPS) ---
    function draw3DPipe(x, y, width, height, isTop) {
        const capHeight = 32;
        const capOverlap = 10;
        const capWidth = width + capOverlap * 2;
        const capX = x - capOverlap;

        // Determine Body and Cap Y-positions
        let bodyY = isTop ? 0 : y;
        let bodyHeight = isTop ? (height - capHeight) : height;
        let capY = isTop ? (height - capHeight) : y;

        // Pipe Body Gradient (Metallic Green 3D Cylinder)
        let bodyGrad = ctx.createLinearGradient(x, 0, x + width, 0);
        bodyGrad.addColorStop(0, '#2d4500');
        bodyGrad.addColorStop(0.15, '#558000');
        bodyGrad.addColorStop(0.35, '#a3e048');
        bodyGrad.addColorStop(0.65, '#73bf2e');
        bodyGrad.addColorStop(0.9, '#385e00');
        bodyGrad.addColorStop(1, '#1b3000');

        ctx.fillStyle = bodyGrad;
        ctx.fillRect(x, bodyY, width, bodyHeight);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, bodyY, width, bodyHeight);

        // Pipe Cap / Rim Gradient
        let capGrad = ctx.createLinearGradient(capX, 0, capX + capWidth, 0);
        capGrad.addColorStop(0, '#2d4500');
        capGrad.addColorStop(0.15, '#558000');
        capGrad.addColorStop(0.35, '#b8f054');
        capGrad.addColorStop(0.65, '#73bf2e');
        capGrad.addColorStop(0.9, '#385e00');
        capGrad.addColorStop(1, '#1b3000');

        ctx.fillStyle = capGrad;
        ctx.fillRect(capX, capY, capWidth, capHeight);
        ctx.strokeRect(capX, capY, capWidth, capHeight);

        // Highlight Specular Lines
        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.fillRect(x + width * 0.22, bodyY, width * 0.08, bodyHeight);
        ctx.fillRect(capX + capWidth * 0.22, capY, capWidth * 0.08, capHeight);
    }

    function drawBird(p, frame) {
        const b = p.bird;
        if (!b.isAlive) return;

        ctx.save();
        ctx.translate(b.x, b.y);

        let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, b.velocity * 0.08));
        ctx.rotate(angle);

        // Name Tag with Background Pill
        ctx.font = "bold 13px Arial";
        let textWidth = ctx.measureText(p.name).width;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(-textWidth/2 - 6, -b.radius - 22, textWidth + 12, 18);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.fillText(p.name, 0, -b.radius - 9);

        // Bird Body
        ctx.fillStyle = p.color.hex;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.radius + 4, b.radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Animated Wing
        let wingOffsetY = Math.sin(frame * 0.25) * 7;
        ctx.fillStyle = p.color.dark;
        ctx.beginPath();
        ctx.ellipse(-6, wingOffsetY, 11, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eye & Beak
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(8, -6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(10, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 8);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        if (!gameActive) return;
        frameCounter++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Enhanced Sky & Ground Background
        drawEnhancedBackground(frameCounter);

        const config = configuration[chosenLevel];
        const groundY = canvas.height - 50;

        // Physics Updates
        let activeCount = 0;
        connectedPlayers.forEach(p => {
            if (p.bird.isAlive) {
                activeCount++;
                p.bird.velocity += GRAVITY;
                p.bird.y += p.bird.velocity;

                // Out of Bounds (Ceiling or Ground)
                if (p.bird.y + p.bird.radius > groundY || p.bird.y - p.bird.radius < 0) {
                    p.bird.isAlive = false;
                }
            }
            drawBird(p, frameCounter);
        });

        document.getElementById('alive-count').innerText = activeCount;

        // Pipes Logic & Rendering
        for (let i = pipes.length - 1; i >= 0; i--) {
            let pipe = pipes[i];
            pipe.x -= config.speed;

            let bottomY = pipe.topHeight + pipe.gap;

            // Render 3D Tubes
            draw3DPipe(pipe.x, 0, pipe.width, pipe.topHeight, true);
            draw3DPipe(pipe.x, bottomY, pipe.width, groundY - bottomY, false);

            // Labels with thick text shadow for high readability
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.shadowColor = "black"; ctx.shadowBlur = 8;
            ctx.fillText(pipe.topText, pipe.x + pipe.width / 2, pipe.topHeight - 45);
            ctx.fillText(pipe.bottomText, pipe.x + pipe.width / 2, bottomY + 45);
            ctx.shadowBlur = 0;

            // Collision check per player against 3D tubes
            connectedPlayers.forEach(p => {
                if (!p.bird.isAlive) return;

                if (p.bird.x + p.bird.radius > pipe.x - 10 && p.bird.x - p.bird.radius < pipe.x + pipe.width + 10) {
                    if (p.bird.y - p.bird.radius < pipe.topHeight) {
                        if (pipe.topIsCorrect) p.bird.score++;
                        else p.bird.isAlive = false;
                    } 
                    else if (p.bird.y + p.bird.radius > bottomY) {
                        if (!pipe.topIsCorrect) p.bird.score++;
                        else p.bird.isAlive = false;
                    }
                }
            });

            if (pipe.x + pipe.width < 0) {
                pipes.splice(i, 1);
                spawnPipeSet(800);
            }
        }

        if (activeCount === 0) {
            endMatch();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    function endMatch() {
        gameActive = false;
        cancelAnimationFrame(animationId);

        let resultsHTML = "<h3>Leaderboard</h3>";
        let sorted = [...connectedPlayers].sort((a, b) => b.bird.score - a.bird.score);
        
        sorted.forEach((p, rank) => {
            resultsHTML += `<p style="color:${p.color.hex}">${rank + 1}. ${p.name} - ${p.bird.score} pts</p>`;
        });

        document.getElementById('leaderboard-results').innerHTML = resultsHTML;
        switchScreen('gameplay-container', 'gameover-screen');
    }

    function restartMatch() {
        switchScreen('gameover-screen', 'gameplay-container');
        initMatch();
    }
</script>
