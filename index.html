<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Verbs - Multiplayer EFL Game</title>
    <!-- PeerJS WebRTC Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background: #10101c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1000px;
            height: 500px;
            background: #4ec0ca;
            border: 6px solid #fff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 10px 0; text-shadow: 3px 3px #000; font-size: 2.8rem; color: #ffeb3b; }
        h2 { margin: 0 0 15px 0; text-shadow: 2px 2px #000; font-size: 1.4rem; }
        
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 50%;
            box-shadow: 0 4px #bf360c;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #bf360c; }
        .btn-level { background: #4caf50; box-shadow: 0 4px #1b5e20; }
        .btn-join { background: #2196f3; box-shadow: 0 4px #0d47a1; }

        input {
            width: 50%;
            padding: 10px 18px;
            margin: 6px 0;
            font-size: 1.2rem;
            border-radius: 25px;
            border: 3px solid #fff;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #player-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 75%;
            margin: 10px 0;
        }
        .slot {
            background: rgba(0,0,0,0.5);
            border: 2px dashed #fff;
            padding: 8px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
        }

        canvas { display: block; background: #4ec0ca; }

        #hud {
            position: absolute;
            top: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; font-size: 1.2rem; font-weight: bold;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 5;
        }
        #audio-controls {
            pointer-events: auto;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem;
        }
        #prompt-banner {
            position: absolute;
            top: 45px; left: 0; width: 100%;
            text-align: center; font-size: 1.8rem; font-weight: bold;
            color: #fff; text-shadow: 3px 3px #000;
            pointer-events: none; z-index: 5;
            background: rgba(0,0,0,0.4); padding: 4px 0;
        }

        #scoreboard-panel {
            position: absolute;
            top: 95px; right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 10px 14px;
            width: 190px;
            z-index: 6;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #scoreboard-panel h3 {
            margin: 0 0 6px 0;
            font-size: 1rem;
            text-align: center;
            color: #ffeb3b;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 4px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .player-status-tag {
            width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px;
        }

        #elim-banner {
            position: absolute;
            top: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(244, 67, 54, 0.92);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 2px 2px #000;
            border: 3px solid #fff;
            z-index: 8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #mobile-controller {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #111;
        }
        #tap-button {
            width: 90%; height: 75%;
            border-radius: 25px;
            border: 5px solid #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: bold; text-shadow: 2px 2px #000;
            box-shadow: 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

<audio id="bgm" src="8782.mp3" loop></audio>

<div id="game-container">
    <div id="mode-screen" class="screen">
        <h1>Flappy Verbs</h1>
        <h2>Select Display Mode</h2>
        <button class="btn btn-level" onclick="setupHost()">🖥️ Host Game (Smartboard)</button>
        <button class="btn btn-join" onclick="showJoinScreen()">📱 Join Game (Student Device)</button>
    </div>

    <div id="host-lobby-screen" class="screen hidden">
        <h1 style="font-size:2.2rem; margin-bottom:5px;">Room Code: <span id="room-code-display" style="color:#ffeb3b;">----</span></h1>
        <div style="display:flex; align-items:center; gap:20px;">
            <img id="qr-code-img" src="" width="100" height="100" style="border:3px solid #fff; border-radius:8px;" alt="QR Code">
            <div style="text-align:left;">
                <p style="margin:0; font-size:1.1rem;">1. Scan QR or enter Room Code.</p>
                <p style="margin:5px 0 0 0; font-size:1.1rem;">2. Enter student name.</p>
            </div>
        </div>
        <div id="player-slots">
            <div class="slot" id="slot-0">Waiting...</div>
            <div class="slot" id="slot-1">Waiting...</div>
            <div class="slot" id="slot-2">Waiting...</div>
            <div class="slot" id="slot-3">Waiting...</div>
            <div class="slot" id="slot-4">Waiting...</div>
            <div class="slot" id="slot-5">Waiting...</div>
        </div>
        <h2>Select CEFR & Tense</h2>
        <div style="display:flex; gap:10px; width:60%;">
            <select id="cefr-select" style="flex:1; font-size:1rem; padding:6px; border-radius:10px; font-weight:bold;">
                <option value="A1">A1 - Beginner</option>
                <option value="A2">A2 - Elementary</option>
                <option value="B1">B1 - Intermediate</option>
                <option value="B2">B2 - Upper Intermediate</option>
                <option value="C1">C1 - Advanced</option>
            </select>
            <select id="tense-select" style="flex:1; font-size:1rem; padding:6px; border-radius:10px; font-weight:bold;">
                <option value="simplePast">Simple Past</option>
                <option value="participle">Past Participle</option>
            </select>
        </div>
        <button class="btn btn-level" style="margin-top:10px; width:40%;" onclick="startHostGame()">🚀 Start Match</button>
    </div>

    <div id="join-screen" class="screen hidden">
        <h1>Join Game</h1>
        <input type="text" id="join-code-input" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;">
        <input type="text" id="player-name-input" placeholder="YOUR NAME" maxlength="10">
        <button class="btn btn-join" onclick="connectToHost()">Connect</button>
        <p id="join-status" style="color:#ffeb3b; font-weight:bold;"></p>
    </div>

    <div id="controller-screen" class="screen hidden">
        <div id="mobile-controller">
            <h2 id="player-hud-name" style="margin:10px 0;">Player</h2>
            <div id="tap-button" onmousedown="sendFlap()" ontouchstart="sendFlap(event)">TAP TO FLAP</div>
        </div>
    </div>

    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.88);">
        <h1 style="color: #f44336; font-size: 3rem;">Match Ended</h1>
        <div id="leaderboard-results" style="width:80%; font-size:1.2rem; line-height:1.5; font-weight:bold; margin-bottom:15px;"></div>
        <button class="btn btn-level" style="width:40%;" onclick="restartMatch()">Play Again</button>
    </div>

    <div id="gameplay-container" class="hidden">
        <div id="hud">
            <span>Players Alive: <span id="alive-count">0</span></span>
            <div id="audio-controls">
                <button id="bgm-toggle-btn" style="background:#ff9100; border:none; color:#fff; font-weight:bold; border-radius:12px; padding:4px 10px; cursor:pointer;" onclick="toggleBGM()">🎵 Music</button>
                <label style="display:flex; align-items:center; gap:5px;">
                    🔈
                    <input type="range" id="bgm-vol-slider" min="0" max="1" step="0.05" value="0.4" style="width:70px;" oninput="adjustBGMVolume(this.value)">
                </label>
            </div>
        </div>

        <div id="prompt-banner">Infinitive: <span id="target-verb" style="color:#ffeb3b;">GO</span></div>

        <div id="scoreboard-panel">
            <h3>Scoreboard</h3>
            <div id="scoreboard-list"></div>
        </div>

        <div id="elim-banner" class="hidden"></div>

        <canvas id="gameCanvas" width="1000" height="500"></canvas>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE SERVIDORES STUN (CRUCIAL PARA CONECTAR MÚLTIPLES DISPOSITIVOS RED MÓVIL/WIFI)
    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ]
        }
    };

    const BIRD_COLORS = [
        { name: "Yellow", hex: "#ffeb3b", dark: "#f57f17" },
        { name: "Red", hex: "#ff1744", dark: "#b71c1c" },
        { name: "Cyan", hex: "#00e5ff", dark: "#00838f" },
        { name: "Green", hex: "#00e676", dark: "#1b5e20" },
        { name: "Magenta", hex: "#e040fb", dark: "#4a148c" },
        { name: "Orange", hex: "#ff9100", dark: "#e65100" }
    ];

    const configuration = {
        A1: { speed: 1.8, gap: 210 },
        A2: { speed: 2.1, gap: 195 },
        B1: { speed: 2.4, gap: 180 },
        B2: { speed: 2.7, gap: 170 },
        C1: { speed: 3.0, gap: 160 }
    };

    const verbDatabase = {
        A1: {
            simplePast: [
                { inf: "Play", corr: "played", incorr: "playedd" }, { inf: "Eat", corr: "ate", incorr: "eated" },
                { inf: "Like", corr: "liked", incorr: "liken" }, { inf: "Go", corr: "went", incorr: "gone" },
                { inf: "Make", corr: "made", incorr: "maked" }, { inf: "Have", corr: "had", incorr: "haved" },
                { inf: "See", corr: "saw", incorr: "seen" }, { inf: "Do", corr: "did", incorr: "doed" },
                { inf: "Come", corr: "came", incorr: "comed" }, { inf: "Take", corr: "took", incorr: "taked" }
            ],
            participle: [
                { inf: "Play", corr: "played", incorr: "playen" }, { inf: "Eat", corr: "eaten", incorr: "ate" },
                { inf: "Like", corr: "liked", incorr: "liket" }, { inf: "Go", corr: "gone", incorr: "went" },
                { inf: "Make", corr: "made", incorr: "maken" }, { inf: "Have", corr: "had", incorr: "hadder" }
            ]
        },
        A2: {
            simplePast: [
                { inf: "Study", corr: "studied", incorr: "studyed" }, { inf: "Buy", corr: "bought", incorr: "buyed" },
                { inf: "Stop", corr: "stopped", incorr: "stoped" }, { inf: "Write", corr: "wrote", incorr: "writed" }
            ],
            participle: [
                { inf: "Study", corr: "studied", incorr: "studien" }, { inf: "Buy", corr: "bought", incorr: "boughten" },
                { inf: "Stop", corr: "stopped", incorr: "stopt" }, { inf: "Write", corr: "written", incorr: "wrote" }
            ]
        },
        B1: { simplePast: [{ inf: "Lose", corr: "lost", incorr: "loosed" }], participle: [{ inf: "Lose", corr: "lost", incorr: "loosen" }] },
        B2: { simplePast: [{ inf: "Freeze", corr: "froze", incorr: "freezed" }], participle: [{ inf: "Freeze", corr: "frozen", incorr: "froze" }] },
        C1: { simplePast: [{ inf: "Tear", corr: "tore", incorr: "teared" }], participle: [{ inf: "Tear", corr: "torn", incorr: "toren" }] }
    };

    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playFlapSFX() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }

    function playQuackSFX() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(380, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.32);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(850, ctx.currentTime);
            filter.Q.setValueAtTime(3.5, ctx.currentTime);

            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.32);

            osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.32);
        } catch (e) {}
    }

    function playScoreSFX() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        } catch (e) {}
    }

    const bgmAudio = document.getElementById('bgm');
    bgmAudio.volume = 0.4;

    function toggleBGM() {
        if (bgmAudio.paused) {
            bgmAudio.play().catch(() => {});
            document.getElementById('bgm-toggle-btn').innerText = "⏸️ Pause";
        } else {
            bgmAudio.pause();
            document.getElementById('bgm-toggle-btn').innerText = "🎵 Music";
        }
    }

    function adjustBGMVolume(val) { bgmAudio.volume = val; }

    let isHost = false;
    let peer = null;
    let clientConn = null;
    let roomCode = "";
    let connectedPlayers = [];
    let gameActive = false;
    let frameCounter = 0;
    let chosenLevel = "A1";
    let chosenType = "simplePast";

    const GRAVITY = 0.12;
    const FLAP_STRENGTH = -4.2;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let pipes = [];
    let particles = [];
    let currentVerbPair = null;
    let animationId = null;
    let pipeIdCounter = 0;
    let elimBannerTimer = null;

    function switchScreen(fromId, toId) {
        document.getElementById(fromId).classList.add('hidden');
        document.getElementById(toId).classList.remove('hidden');
    }

    function setupHost() {
        isHost = true;
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('room-code-display').innerText = roomCode;

        const currentUrl = window.location.href.split('?')[0];
        const joinUrl = `${currentUrl}?room=${roomCode}`;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;

        peer = new Peer(`FV-${roomCode}`, peerConfig);
        
        peer.on('open', () => switchScreen('mode-screen', 'host-lobby-screen'));
        peer.on('connection', (conn) => {
            conn.on('open', () => {
                conn.on('data', (data) => handleHostMessage(conn, data));
            });
            conn.on('close', () => removePlayer(conn.peer));
            conn.on('error', () => removePlayer(conn.peer));
        });
        peer.on('error', (err) => console.error("PeerJS Host Error: ", err));
    }

    function handleHostMessage(conn, data) {
        if (data.type === 'JOIN') {
            const existingPlayer = connectedPlayers.find(p => p.id === conn.peer);
            if (existingPlayer) return;

            if (connectedPlayers.length >= 6 || gameActive) {
                conn.send({ type: 'ERROR', message: 'Room Full or Game in Progress' });
                return;
            }

            const colorObj = BIRD_COLORS[connectedPlayers.length];
            const player = {
                id: conn.peer,
                name: data.name || `Player ${connectedPlayers.length + 1}`,
                color: colorObj,
                conn: conn,
                bird: {
                    x: 120 + (connectedPlayers.length * 35),
                    y: 250,
                    radius: 17,
                    velocity: 0,
                    isAlive: true,
                    score: 0,
                    hasWonBonus: false,
                    scoredPipes: new Set()
                }
            };
            connectedPlayers.push(player);
            updateLobbyUI();
            conn.send({ type: 'JOIN_SUCCESS', color: colorObj, name: player.name });
        } else if (data.type === 'FLAP') {
            const p = connectedPlayers.find(p => p.id === conn.peer);
            if (p && p.bird.isAlive && gameActive) {
                p.bird.velocity = FLAP_STRENGTH;
                playFlapSFX();
            }
        }
    }

    function updateLobbyUI() {
        for (let i = 0; i < 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            if (connectedPlayers[i]) {
                slot.style.background = connectedPlayers[i].color.hex;
                slot.style.color = '#000';
                slot.innerText = `${i + 1}. ${connectedPlayers[i].name}`;
            } else {
                slot.style.background = "rgba(0,0,0,0.5)";
                slot.style.color = "#fff";
                slot.innerText = "Waiting...";
            }
        }
    }

    function removePlayer(peerId) {
        connectedPlayers = connectedPlayers.filter(p => p.id !== peerId);
        updateLobbyUI();
    }

    function showJoinScreen() {
        switchScreen('mode-screen', 'join-screen');
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            document.getElementById('join-code-input').value = urlParams.get('room');
        }
    }

    function connectToHost() {
        const code = document.getElementById('join-code-input').value.toUpperCase();
        const name = document.getElementById('player-name-input').value;

        if (!code || !name) {
            document.getElementById('join-status').innerText = "Enter Code & Name!";
            return;
        }

        document.getElementById('join-status').innerText = "Connecting...";
        peer = new Peer(peerConfig);

        peer.on('open', () => {
            clientConn = peer.connect(`FV-${code}`, { reliable: true });

            clientConn.on('open', () => {
                setTimeout(() => {
                    clientConn.send({ type: 'JOIN', name: name });
                }, 100);
            });

            clientConn.on('data', (data) => {
                if (data.type === 'JOIN_SUCCESS') {
                    document.getElementById('player-hud-name').innerText = data.name;
                    document.getElementById('tap-button').style.background = data.color.hex;
                    document.getElementById('tap-button').style.color = '#000';
                    switchScreen('join-screen', 'controller-screen');
                } else if (data.type === 'ERROR') {
                    document.getElementById('join-status').innerText = data.message;
                }
            });

            clientConn.on('error', () => {
                document.getElementById('join-status').innerText = "Connection Failed!";
            });
        });

        peer.on('error', (err) => {
            document.getElementById('join-status').innerText = "Room not found!";
        });
    }

    function sendFlap(e) {
        if (e && e.type === 'touchstart') e.preventDefault();
        if (clientConn && clientConn.open) {
            clientConn.send({ type: 'FLAP' });
        }
    }

    function startHostGame() {
        if (connectedPlayers.length === 0) {
            alert("At least 1 player must join!");
            return;
        }
        chosenLevel = document.getElementById('cefr-select').value;
        chosenType = document.getElementById('tense-select').value;

        switchScreen('host-lobby-screen', 'gameplay-container');
        bgmAudio.play().catch(() => {});
        initMatch();
    }

    function initMatch() {
        frameCounter = 0;
        pipeIdCounter = 0;
        pipes = [];
        particles = [];
        gameActive = true;

        connectedPlayers.forEach((p, idx) => {
            p.bird.y = 250;
            p.bird.velocity = 0;
            p.bird.isAlive = true;
            p.bird.score = 0;
            p.bird.hasWonBonus = false;
            p.bird.scoredPipes = new Set();
            p.bird.x = 120 + (idx * 30);
        });

        spawnPipeSet(1000);
        updateLiveScoreboard();
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function createBirdExplosion(x, y, colorHex) {
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                radius: Math.random() * 6 + 2,
                color: Math.random() > 0.3 ? colorHex : "#ff5722",
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    function updateAndDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.alpha -= pt.decay;

            if (pt.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = pt.alpha;
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function triggerEliminationAlert(playerName, remainingCount) {
        const banner = document.getElementById('elim-banner');
        banner.innerText = `💥 ¡${playerName} ha sido eliminado! (${remainingCount} en juego)`;
        banner.classList.remove('hidden');

        if (elimBannerTimer) clearTimeout(elimBannerTimer);
        elimBannerTimer = setTimeout(() => {
            banner.classList.add('hidden');
        }, 2200);
    }

    function killBird(player) {
        if (!player.bird.isAlive) return;

        player.bird.isAlive = false;
        playQuackSFX();
        createBirdExplosion(player.bird.x, player.bird.y, player.color.hex);

        const remainingAlive = connectedPlayers.filter(p => p.bird.isAlive).length;
        triggerEliminationAlert(player.name, remainingAlive);

        if (connectedPlayers.length > 1 && remainingAlive === 1) {
            const lastManStanding = connectedPlayers.find(p => p.bird.isAlive);
            if (lastManStanding && !lastManStanding.bird.hasWonBonus) {
                lastManStanding.bird.score += 5;
                lastManStanding.bird.hasWonBonus = true;
            }
        }

        updateLiveScoreboard();
    }

    function updateLiveScoreboard() {
        const listDiv = document.getElementById('scoreboard-list');
        let html = "";
        let sorted = [...connectedPlayers].sort((a, b) => b.bird.score - a.bird.score);

        sorted.forEach(p => {
            const statusColor = p.bird.isAlive ? "#4caf50" : "#f44336";
            const textStyle = p.bird.isAlive ? "color:#fff;" : "color:#888; text-decoration:line-through;";
            html += `
                <div class="score-row" style="${textStyle}">
                    <span><span class="player-status-tag" style="background:${statusColor};"></span>${p.name}</span>
                    <span style="color:${p.color.hex};">${p.bird.score} pts</span>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function spawnPipeSet(startX) {
        const config = configuration[chosenLevel];
        const pool = verbDatabase[chosenLevel][chosenType];
        currentVerbPair = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('target-verb').innerText = currentVerbPair.inf.toUpperCase();

        const minHeight = 70;
        const maxHeight = canvas.height - config.gap - minHeight - 50;
        const topPipeHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        const isTopCorrect = Math.random() > 0.5;

        pipes.push({
            id: ++pipeIdCounter,
            x: startX,
            width: 120,
            topHeight: topPipeHeight,
            gap: config.gap,
            topText: isTopCorrect ? currentVerbPair.corr : currentVerbPair.incorr,
            bottomText: isTopCorrect ? currentVerbPair.incorr : currentVerbPair.corr,
            topIsCorrect: isTopCorrect
        });
    }

    function drawEnhancedBackground(frame) {
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#4ec0ca');
        skyGrad.addColorStop(0.7, '#81d4fa');
        skyGrad.addColorStop(1, '#e0f7fa');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        let cloudX1 = (frame * 0.4) % (canvas.width + 200) - 100;
        let cloudX2 = (frame * 0.2 + 400) % (canvas.width + 200) - 100;

        drawCloud(cloudX1, 60, 35);
        drawCloud(cloudX2, 110, 25);

        ctx.fillStyle = "#73bf2e";
        ctx.beginPath();
        ctx.arc(200, 470, 220, Math.PI, 0, false);
        ctx.arc(650, 480, 260, Math.PI, 0, false);
        ctx.arc(1000, 470, 200, Math.PI, 0, false);
        ctx.fill();

        const groundHeight = 50;
        const groundY = canvas.height - groundHeight;

        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, groundY, canvas.width, groundHeight);

        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(0, groundY, canvas.width, 12);
        ctx.fillStyle = "#558000";
        ctx.fillRect(0, groundY + 12, canvas.width, 4);

        ctx.strokeStyle = "#ceb86c";
        ctx.lineWidth = 6;
        let offset = (frame * 2) % 24;
        for (let x = -30 + offset; x < canvas.width + 30; x += 24) {
            ctx.beginPath();
            ctx.moveTo(x, groundY + 16);
            ctx.lineTo(x - 12, canvas.height);
            ctx.stroke();
        }
    }

    function drawCloud(x, y, scale) {
        ctx.beginPath();
        ctx.arc(x, y, scale, 0, Math.PI * 2);
        ctx.arc(x + scale * 0.7, y - scale * 0.4, scale * 0.7, 0, Math.PI * 2);
        ctx.arc(x + scale * 1.3, y, scale * 0.8, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
    }

    function draw3DPipe(x, y, width, height, isTop) {
        const capHeight = 30;
        const capOverlap = 8;
        const capWidth = width + capOverlap * 2;
        const capX = x - capOverlap;

        let bodyY = isTop ? 0 : y;
        let bodyHeight = isTop ? (height - capHeight) : height;
        let capY = isTop ? (height - capHeight) : y;

        let bodyGrad = ctx.createLinearGradient(x, 0, x + width, 0);
        bodyGrad.addColorStop(0, '#2d4500');
        bodyGrad.addColorStop(0.15, '#558000');
        bodyGrad.addColorStop(0.35, '#a3e048');
        bodyGrad.addColorStop(0.65, '#73bf2e');
        bodyGrad.addColorStop(0.9, '#385e00');
        bodyGrad.addColorStop(1, '#1b3000');

        ctx.fillStyle = bodyGrad;
        ctx.fillRect(x, bodyY, width, bodyHeight);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, bodyY, width, bodyHeight);

        let capGrad = ctx.createLinearGradient(capX, 0, capX + capWidth, 0);
        capGrad.addColorStop(0, '#2d4500');
        capGrad.addColorStop(0.15, '#558000');
        capGrad.addColorStop(0.35, '#b8f054');
        capGrad.addColorStop(0.65, '#73bf2e');
        capGrad.addColorStop(0.9, '#385e00');
        capGrad.addColorStop(1, '#1b3000');

        ctx.fillStyle = capGrad;
        ctx.fillRect(capX, capY, capWidth, capHeight);
        ctx.strokeRect(capX, capY, capWidth, capHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.fillRect(x + width * 0.22, bodyY, width * 0.08, bodyHeight);
        ctx.fillRect(capX + capWidth * 0.22, capY, capWidth * 0.08, capHeight);
    }

    function drawBird(p, frame) {
        const b = p.bird;
        if (!b.isAlive) return;

        ctx.save();
        ctx.translate(b.x, b.y);

        let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, b.velocity * 0.08));
        ctx.rotate(angle);

        ctx.font = "bold 12px Arial";
        let textWidth = ctx.measureText(p.name).width;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(-textWidth/2 - 5, -b.radius - 20, textWidth + 10, 16);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.fillText(p.name, 0, -b.radius - 8);

        ctx.fillStyle = p.color.hex;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.radius + 3, b.radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        let wingOffsetY = Math.sin(frame * 0.25) * 6;
        ctx.fillStyle = p.color.dark;
        ctx.beginPath();
        ctx.ellipse(-5, wingOffsetY, 10, 5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(7, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(9, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(11, 0); ctx.lineTo(20, 3); ctx.lineTo(11, 7);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        if (!gameActive) return;
        frameCounter++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawEnhancedBackground(frameCounter);

        const config = configuration[chosenLevel];
        const groundY = canvas.height - 50;

        let activeCount = 0;
        connectedPlayers.forEach(p => {
            if (p.bird.isAlive) {
                activeCount++;
                p.bird.velocity += GRAVITY;
                p.bird.y += p.bird.velocity;

                if (p.bird.y + p.bird.radius > groundY || p.bird.y - p.bird.radius < 0) {
                    killBird(p);
                }
            }
            drawBird(p, frameCounter);
        });

        updateAndDrawParticles();

        document.getElementById('alive-count').innerText = activeCount;

        for (let i = pipes.length - 1; i >= 0; i--) {
            let pipe = pipes[i];
            pipe.x -= config.speed;

            let bottomY = pipe.topHeight + pipe.gap;

            draw3DPipe(pipe.x, 0, pipe.width, pipe.topHeight, true);
            draw3DPipe(pipe.x, bottomY, pipe.width, groundY - bottomY, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.shadowColor = "black"; ctx.shadowBlur = 8;
            ctx.fillText(pipe.topText, pipe.x + pipe.width / 2, pipe.topHeight - 40);
            ctx.fillText(pipe.bottomText, pipe.x + pipe.width / 2, bottomY + 40);
            ctx.shadowBlur = 0;

            connectedPlayers.forEach(p => {
                if (!p.bird.isAlive) return;

                if (p.bird.x + p.bird.radius > pipe.x - 5 && p.bird.x - p.bird.radius < pipe.x + pipe.width + 5) {
                    if (p.bird.y - p.bird.radius < pipe.topHeight) {
                        if (pipe.topIsCorrect) {
                            if (!p.bird.scoredPipes.has(pipe.id)) {
                                p.bird.score++;
                                playScoreSFX();
                                p.bird.scoredPipes.add(pipe.id);
                                updateLiveScoreboard();
                            }
                        } else {
                            killBird(p);
                        }
                    } 
                    else if (p.bird.y + p.bird.radius > bottomY) {
                        if (!pipe.topIsCorrect) {
                            if (!p.bird.scoredPipes.has(pipe.id)) {
                                p.bird.score++;
                                playScoreSFX();
                                p.bird.scoredPipes.add(pipe.id);
                                updateLiveScoreboard();
                            }
                        } else {
                            killBird(p);
                        }
                    }
                }
            });

            if (pipe.x + pipe.width < 0) {
                pipes.splice(i, 1);
                spawnPipeSet(1000);
            }
        }

        if (activeCount === 0) {
            endMatch();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    function endMatch() {
        gameActive = false;
        cancelAnimationFrame(animationId);

        let resultsHTML = "<h3 style='margin-bottom:10px;'>Leaderboard Final</h3>";
        let sorted = [...connectedPlayers].sort((a, b) => b.bird.score - a.bird.score);
        
        sorted.forEach((p, rank) => {
            let bonusBadge = p.bird.hasWonBonus ? " 👑 (Last Standing +5)" : "";
            resultsHTML += `<p style="color:${p.color.hex}; margin:4px 0;">${rank + 1}. ${p.name} - ${p.bird.score} pts${bonusBadge}</p>`;
        });

        document.getElementById('leaderboard-results').innerHTML = resultsHTML;
        switchScreen('gameplay-container', 'gameover-screen');
    }

    function restartMatch() {
        switchScreen('gameover-screen', 'gameplay-container');
        initMatch();
    }
</script>
