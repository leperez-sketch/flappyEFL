<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Verbs - Smartboard EFL Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #70c5ce;
            border: 6px solid #fff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        h1 { margin: 0 0 15px 0; text-shadow: 3px 3px #000; font-size: 3.5rem; color: #ffeb3b;}
        h2 { margin: 0 0 20px 0; text-shadow: 2px 2px #000; font-size: 2rem; }
        
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 16px 28px;
            margin: 8px 0;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 70%;
            box-shadow: 0 6px #bf360c;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #bf360c; }
        .btn-level { background: #4caf50; box-shadow: 0 6px #1b5e20; }
        .btn-back { background: #757575; box-shadow: 0 6px #424242; }
        
        canvas { display: block; background: #70c5ce; }
        
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            pointer-events: none;
            z-index: 5;
        }
        #prompt-banner {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px #000;
            pointer-events: none;
            z-index: 5;
            background: rgba(0,0,0,0.3);
            padding: 8px 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen">
        <h1>Flappy Verbs</h1>
        <h2>Select CEFR Level</h2>
        <button class="btn btn-level" onclick="selectLevel('A1')">A1 - Beginner</button>
        <button class="btn btn-level" onclick="selectLevel('A2')">A2 - Elementary</button>
        <button class="btn btn-level" onclick="selectLevel('B1')">B1 - Intermediate</button>
        <button class="btn btn-level" onclick="selectLevel('B2')">B2 - Upper Intermediate</button>
        <button class="btn btn-level" onclick="selectLevel('C1')">C1 - Advanced</button>
    </div>

    <!-- VERB TYPE SCREEN -->
    <div id="type-screen" class="screen hidden">
        <h1>Flappy Verbs</h1>
        <h2 id="selected-level-label">Level</h2>
        <h2>Select Target Tense:</h2>
        <button class="btn" onclick="selectType('simplePast')">Simple Past</button>
        <button class="btn" onclick="selectType('participle')">Past Participle</button>
        <button class="btn btn-back" onclick="backToHome()">⬅ Back</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.88);">
        <h1 style="color: #f44336; font-size: 4rem;">Game Over</h1>
        <h2 id="final-score" style="font-size: 2.2rem;">Score: 0</h2>
        <p id="feedback-text" style="color: #ffeb3b; padding: 0 20px; font-size: 1.6rem; line-height: 1.5; font-weight: bold;"></p>
        <button class="btn" onclick="restartGame()">Play Again</button>
        <button class="btn btn-level" onclick="backToHome()">Main Menu</button>
    </div>

    <!-- GAMEPLAY CANVAS -->
    <div id="gameplay-container" class="hidden">
        <div id="hud">
            <span id="score-display">Score: 0</span>
        </div>
        <div id="prompt-banner">Infinitive: <span id="target-verb" style="color:#ffeb3b;">GO</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
</div>

    // --- AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'flap') {
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else if (type === 'score') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }
    }

                { inf: "Smite", corr: "smote", incorr: "smited" }, { inf: "Spin", corr: "spun", incorr: "spinned" },
                { inf: "Spit", corr: "spat", incorr: "spitted" }, { inf: "Split", corr: "split", incorr: "splitted" },
                { inf: "Stave", corr: "stove", incorr: "staved" }, { inf: "Strew", corr: "strewed", incorr: "strewt" },
                { inf: "Stride", corr: "strode", incorr: "strided" }, { inf: "Strive", corr: "strove", incorr: "strived" },
                { inf: "Sublet", corr: "sublet", incorr: "subletted" }, { inf: "Swell", corr: "swelled", incorr: "swellt" },
                { inf: "Thrust", corr: "thrust", incorr: "thrusted" }, { inf: "Tread", corr: "trod", incorr: "treaded" },
                { inf: "Uphold", corr: "upheld", incorr: "upholded" }, { inf: "Withdraw", corr: "withdrew", incorr: "withdrawed" },
                { inf: "Withhold", corr: "withheld", incorr: "withholded" }, { inf: "Withstand", corr: "withstood", incorr: "withstanded" },
                { inf: "Wring", corr: "wrung", incorr: "wringed" }, { inf: "Overthrow", corr: "overthrew", incorr: "overthrowed" },
                { inf: "Undertake", corr: "undertook", incorr: "undertaked" }, { inf: "Outdo", corr: "outdid", incorr: "outdoed" },
                { inf: "Overhear", corr: "overheard", incorr: "overheared" }, { inf: "Foresee", corr: "foresaw", incorr: "foreseen" }
            ],
            participle: [
                { inf: "Undergo", corr: "undergone", incorr: "underwent" }, { inf: "Overcome", corr: "overcome", incorr: "overcamed" },
                { inf: "Tear", corr: "torn", incorr: "toren" }, { inf: "Shrink", corr: "shrunk", incorr: "shrank" },
                { inf: "Beseech", corr: "besought", incorr: "besoughten" }, { inf: "Cleave", corr: "cloven", incorr: "clove" },
                { inf: "Sling", corr: "slung", incorr: "slungen" }, { inf: "Slink", corr: "slunk", incorr: "slunken" },
                { inf: "Smite", corr: "smitten", incorr: "smote" }, { inf: "Spin", corr: "spun", incorr: "spunnen" },
                { inf: "Spit", corr: "spat", incorr: "spitten" }, { inf: "Split", corr: "split", incorr: "splitten" },
                { inf: "Stave", corr: "stoven", incorr: "stove" }, { inf: "Strew", corr: "strewn", incorr: "strewed" },
                { inf: "Stride", corr: "strridden", incorr: "strode" }, { inf: "Strive", corr: "striven", incorr: "strove" },
                { inf: "Sublet", corr: "sublet", incorr: "subletten" }, { inf: "Swell", corr: "swollen", incorr: "swelled" },
                { inf: "Thrust", corr: "thrust", incorr: "thrusten" }, { inf: "Tread", corr: "trodden", incorr: "trod" },
                { inf: "Uphold", corr: "upheld", incorr: "uphelden" }, { inf: "Withdraw", corr: "withdrawn", incorr: "withdrew" },
                { inf: "Withhold", corr: "withheld", incorr: "withhelden" }, { inf: "Withstand", corr: "withstood", incorr: "withstooden" },
                { inf: "Wring", corr: "wrung", incorr: "wrungen" }, { inf: "Overthrow", corr: "overthrown", incorr: "overthrew" },
                { inf: "Undertake", corr: "undertaken", incorr: "undertook" }, { inf: "Outdo", corr: "outdone", incorr: "outdid" },
                { inf: "Overhear", corr: "overheard", incorr: "overhearden" }, { inf: "Foresee", corr: "foreseen", incorr: "foresaw" }
            ]
        }
    };

    // --- GAME CONFIG & STATE ---
    let chosenLevel = 'A1';
    let chosenType = 'simplePast';
    let score = 0;
    let gameActive = false;
    let frameCounter = 0;

    const configuration = {
        A1: { speed: 1.0, gap: 240 },
        A2: { speed: 1.2, gap: 220 },
        B1: { speed: 1.4, gap: 200 },
        B2: { speed: 1.6, gap: 190 },
        C1: { speed: 1.8, gap: 180 }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRAVITY = 0.12;
    const FLAP_STRENGTH = -4.2;

    let bird = { x: 120, y: 300, radius: 18, velocity: 0 };
    let pipes = [];
    let currentVerbPair = null;
    let animationId = null;

    // --- SCREEN NAVIGATION ---
    function selectLevel(lvl) {
        initAudio();
        chosenLevel = lvl;
        document.getElementById('selected-level-label').innerText = "Level: " + lvl;
        switchScreen('home-screen', 'type-screen');
    }

    function selectType(type) {
        chosenType = type;
        switchScreen('type-screen', 'gameplay-container');
        initGame();
    }

    function backToHome() {
        document.getElementById('type-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('gameplay-container').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
    }

    function switchScreen(fromId, toId) {
        document.getElementById(fromId).classList.add('hidden');
        document.getElementById(toId).classList.remove('hidden');
    }

    // --- CORE GAME LOGIC ---
    function initGame() {
        score = 0;
        frameCounter = 0;
        document.getElementById('score-display').innerText = "Score: " + score;
        bird.y = 300;
        bird.velocity = 0;
        pipes = [];
        gameActive = true;

        spawnPipeSet(800);

        window.removeEventListener('keydown', handleInput);
        canvas.removeEventListener('touchstart', handleInput);
        canvas.removeEventListener('mousedown', handleInput);

        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('mousedown', handleInput);

        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (!gameActive) return;
        
        if (e.type === 'touchstart') e.preventDefault();

        bird.velocity = FLAP_STRENGTH;
        playSound('flap');
    }

    function spawnPipeSet(startX) {
        const config = configuration[chosenLevel];
        const pool = verbDatabase[chosenLevel][chosenType];
        
        currentVerbPair = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('target-verb').innerText = currentVerbPair.inf.toUpperCase();

        const minHeight = 80;
        const maxHeight = canvas.height - config.gap - minHeight;
        const topPipeHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        const isTopCorrect = Math.random() > 0.5;

        pipes.push({
            x: startX,
            width: 130,
            topHeight: topPipeHeight,
            gap: config.gap,
            topText: isTopCorrect ? currentVerbPair.corr : currentVerbPair.incorr,
            bottomText: isTopCorrect ? currentVerbPair.incorr : currentVerbPair.corr,
            topIsCorrect: isTopCorrect,
            passed: false
        });
    }

    // --- 3D PIPE RENDERING WITH CAPS ---
    function drawPipe(x, y, width, height, isTop) {
        // Linear Gradient for 3D Tube Effect
        let grad = ctx.createLinearGradient(x, 0, x + width, 0);
        grad.addColorStop(0, '#388e3c');
        grad.addColorStop(0.2, '#81c784');
        grad.addColorStop(0.4, '#a5d6a7');
        grad.addColorStop(0.7, '#2e7d32');
        grad.addColorStop(1, '#1b5e20');

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, width, height);
        ctx.strokeStyle = '#0d3c10';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);

        // Pipe Cap / Rim
        const capHeight = 32;
        const capWidth = width + 14;
        const capX = x - 7;
        const capY = isTop ? (y + height - capHeight) : y;

        let capGrad = ctx.createLinearGradient(capX, 0, capX + capWidth, 0);
        capGrad.addColorStop(0, '#388e3c');
        capGrad.addColorStop(0.2, '#81c784');
        capGrad.addColorStop(0.4, '#a5d6a7');
        capGrad.addColorStop(0.7, '#2e7d32');
        capGrad.addColorStop(1, '#1b5e20');

        ctx.fillStyle = capGrad;
        ctx.fillRect(capX, capY, capWidth, capHeight);
        ctx.strokeRect(capX, capY, capWidth, capHeight);
    }

    // --- ANIMATED BIRD DRAWING ---
    function drawBird(x, y, radius, velocity, frame) {
        ctx.save();
        ctx.translate(x, y);

        // Rotation based on movement velocity
        let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.08));
        ctx.rotate(angle);

        // Bird Body (Yellow Ellipse)
        ctx.fillStyle = "#ffeb3b";
        ctx.beginPath();
        ctx.ellipse(0, 0, radius + 4, radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // White Belly
        ctx.fillStyle = "#fff8e1";
        ctx.beginPath();
        ctx.ellipse(-2, 4, radius * 0.55, radius * 0.35, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Animated Wing (Flapping Oscillation)
        let wingOffsetY = Math.sin(frame * 0.25) * 7;
        ctx.fillStyle = "#f57c00";
        ctx.beginPath();
        ctx.ellipse(-6, wingOffsetY, 11, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Large Eye
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(8, -6, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupil
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(10, -6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(24, 3);
        ctx.lineTo(12, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function gameLoop() {
        if (!gameActive) return;

        frameCounter++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        ctx.fillStyle = "#70c5ce";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Physics
        bird.velocity += GRAVITY;
        bird.y += bird.velocity;

        // Draw Animated Bird
        drawBird(bird.x, bird.y, bird.radius, bird.velocity, frameCounter);

        // Boundary Check
        if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
            triggerGameOver("Out of boundaries! Fly into the pipe with the correct verb form.");
            return;
        }

        const config = configuration[chosenLevel];

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= config.speed;

            let bottomY = p.topHeight + p.gap;

            // Render 3D Pipes
            drawPipe(p.x, 0, p.width, p.topHeight, true);
            drawPipe(p.x, bottomY, p.width, canvas.height - bottomY, false);

            // Verb Labels inside Pipes with text shadow
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Text Shadows
            ctx.shadowColor = "black";
            ctx.shadowBlur = 6;
            ctx.fillText(p.topText, p.x + p.width / 2, p.topHeight - 45);
            ctx.fillText(p.bottomText, p.x + p.width / 2, bottomY + 45);
            ctx.shadowBlur = 0; // Reset shadow

            // Collision Evaluation
            if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + p.width) {
                
                // Touch Top Pipe
                if (bird.y - bird.radius < p.topHeight) {
                    if (p.topIsCorrect) {
                        scorePoint(i);
                    } else {
                        triggerGameOver(`Wrong! For "${currentVerbPair.inf}", the correct form is: ${currentVerbPair.corr.toUpperCase()}`);
                        return;
                    }
                } 
                // Touch Bottom Pipe
                else if (bird.y + bird.radius > bottomY) {
                    if (!p.topIsCorrect) {
                        scorePoint(i);
                    } else {
                        triggerGameOver(`Wrong! For "${currentVerbPair.inf}", the correct form is: ${currentVerbPair.corr.toUpperCase()}`);
                        return;
                    }
                }
            }

            // Missed pipe set completely
            if (!p.passed && p.x + p.width < bird.x - bird.radius) {
                triggerGameOver(`You missed it! Fly into the correct option. Solution for "${currentVerbPair.inf}": ${currentVerbPair.corr.toUpperCase()}`);
                return;
            }
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    function scorePoint(index) {
        playSound('score');
        score++;
        document.getElementById('score-display').innerText = "Score: " + score;
        pipes.splice(index, 1);
        spawnPipeSet(800);
    }

    function triggerGameOver(reason) {
        gameActive = false;
        playSound('wrong');
        cancelAnimationFrame(animationId);
        document.getElementById('final-score').innerText = "Final Score: " + score;
        document.getElementById('feedback-text').innerText = reason;
        switchScreen('gameplay-container', 'gameover-screen');
    }

    function restartGame() {
        switchScreen('gameover-screen', 'gameplay-container');
        initGame();
    }
</script>
